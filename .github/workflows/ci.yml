name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable check --all-targets --locked
      - run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --all-targets --locked
      - run: RUSTDOCFLAGS=-Dwarnings cargo +stable doc --no-deps --locked
      - run: cargo +stable package --locked
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
