[package]
name = "envdrift"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Detect drift between Rust project declarations and local state"
license = "MIT"
repository = "https://github.com/joshiii-xyz/envdrift"
keywords = ["cargo", "environment", "drift", "diagnostics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"

[dev-dependencies]
tempfile = "3.13"
